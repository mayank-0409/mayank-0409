<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="Courier New, monospace">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3c72"/>
      <stop offset="1" stop-color="#2a5298"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2e8b57"/>
      <stop offset="0.5" stop-color="#54d17a"/>
      <stop offset="1" stop-color="#2e8b57"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="800" height="400" fill="url(#sky)"/>

  <!-- twinkling stars -->
  <circle cx="70" cy="55" r="2.5" fill="#ffffff">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="35" r="2" fill="#ffffff">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="420" cy="60" r="2.5" fill="#ffffff">
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="560" cy="30" r="2" fill="#ffffff">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- moon -->
  <circle cx="700" cy="72" r="34" fill="#ffd93d"/>
  <circle cx="688" cy="62" r="6" fill="#f0c419"/>
  <circle cx="710" cy="82" r="8" fill="#f0c419"/>

  <!-- UFO cruising by -->
  <g>
    <ellipse cx="0" cy="0" rx="42" ry="14" fill="#9aa5b1"/>
    <path d="M -20 -6 Q 0 -34 20 -6 Z" fill="#7fdbff" opacity="0.9"/>
    <circle cx="-18" cy="4" r="4" fill="#ff5252">
      <animate attributeName="fill" values="#ff5252;#ffe066;#ff5252" dur="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="6" r="4" fill="#69f0ae">
      <animate attributeName="fill" values="#69f0ae;#ff5252;#69f0ae" dur="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="18" cy="4" r="4" fill="#ffe066">
      <animate attributeName="fill" values="#ffe066;#69f0ae;#ffe066" dur="0.8s" repeatCount="indefinite"/>
    </circle>
    <animateTransform attributeName="transform" type="translate" from="900 95" to="-120 95" dur="22s" repeatCount="indefinite"/>
  </g>

  <!-- cloud 1 -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="0" cy="150" rx="55" ry="22"/>
    <ellipse cx="45" cy="135" rx="40" ry="20"/>
    <ellipse cx="-45" cy="138" rx="38" ry="18"/>
    <animateTransform attributeName="transform" type="translate" from="880 0" to="-160 0" dur="16s" repeatCount="indefinite"/>
  </g>

  <!-- cloud 2 -->
  <g fill="#ffffff" opacity="0.65">
    <ellipse cx="0" cy="250" rx="45" ry="18"/>
    <ellipse cx="38" cy="238" rx="32" ry="16"/>
    <ellipse cx="-38" cy="240" rx="30" ry="14"/>
    <animateTransform attributeName="transform" type="translate" from="880 0" to="-160 0" dur="12s" begin="-6s" repeatCount="indefinite"/>
  </g>

  <!-- pipe pair 1 -->
  <g>
    <rect x="0" y="0" width="72" height="150" fill="url(#pipe)" stroke="#1d5c38" stroke-width="3"/>
    <rect x="-8" y="138" width="88" height="26" rx="6" fill="url(#pipe)" stroke="#1d5c38" stroke-width="3"/>
    <rect x="0" y="270" width="72" height="130" fill="url(#pipe)" stroke="#1d5c38" stroke-width="3"/>
    <rect x="-8" y="256" width="88" height="26" rx="6" fill="url(#pipe)" stroke="#1d5c38" stroke-width="3"/>
    <animateTransform attributeName="transform" type="translate" from="880 0" to="-160 0" dur="8s" repeatCount="indefinite"/>
  </g>

  <!-- pipe pair 2 -->
  <g>
    <rect x="0" y="0" width="72" height="110" fill="url(#pipe)" stroke="#1d5c38" stroke-width="3"/>
    <rect x="-8" y="98" width="88" height="26" rx="6" fill="url(#pipe)" stroke="#1d5c38" stroke-width="3"/>
    <rect x="0" y="300" width="72" height="100" fill="url(#pipe)" stroke="#1d5c38" stroke-width="3"/>
    <rect x="-8" y="286" width="88" height="26" rx="6" fill="url(#pipe)" stroke="#1d5c38" stroke-width="3"/>
    <animateTransform attributeName="transform" type="translate" from="880 0" to="-160 0" dur="8s" begin="-4s" repeatCount="indefinite"/>
  </g>

  <!-- ground -->
  <rect y="350" width="800" height="50" fill="#ded895"/>
  <rect y="350" width="800" height="12" fill="#73bf2e"/>
  <g fill="#cbc46f">
    <g>
      <rect x="0" y="366" width="40" height="34"/>
      <rect x="80" y="366" width="40" height="34"/>
      <rect x="160" y="366" width="40" height="34"/>
      <rect x="240" y="366" width="40" height="34"/>
      <rect x="320" y="366" width="40" height="34"/>
      <rect x="400" y="366" width="40" height="34"/>
      <rect x="480" y="366" width="40" height="34"/>
      <rect x="560" y="366" width="40" height="34"/>
      <rect x="640" y="366" width="40" height="34"/>
      <rect x="720" y="366" width="40" height="34"/>
      <rect x="800" y="366" width="40" height="34"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-80 0" dur="1.2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- the flying dev bird -->
  <g transform="translate(220 190)">
    <g>
      <ellipse cx="0" cy="0" rx="26" ry="18" fill="#ffcf40" stroke="#b8860b" stroke-width="3"/>
      <polygon points="24,-4 46,2 24,8" fill="#ff8c00"/>
      <circle cx="10" cy="-6" r="5" fill="#ffffff"/>
      <circle cx="11.5" cy="-6" r="2.3" fill="#111111"/>
      <path d="M -6 2 Q -16 -16 -32 -7 Q -19 9 -6 6 Z" fill="#ffb300" stroke="#b8860b" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" values="-24 -6 2;26 -6 2;-24 -6 2" dur="0.45s" repeatCount="indefinite"/>
      </path>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -30;0 18;0 0" keyTimes="0;0.35;0.7;1" dur="3s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- HUD -->
  <text x="24" y="48" font-size="32" font-weight="bold" fill="#ffffff" stroke="#000000" stroke-width="1">SCORE: 042</text>
  <text x="640" y="48" font-size="28" fill="#ff5252">&#9829;&#9829;&#9829;</text>
  <text x="290" y="330" font-size="22" font-weight="bold" fill="#ffffff" opacity="1">TAP TO FLY &#9650;
    <animate attributeName="opacity" values="1;0.1;1" dur="1.1s" repeatCount="indefinite"/>
  </text>
  <text x="250" y="392" font-size="16" font-weight="bold" fill="#5a5433">FLAPPY DEV &#8212; PYTHON EDITION v1.0</text>
</svg>
